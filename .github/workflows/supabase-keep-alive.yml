name: Supabase Keep Alive

on:
  schedule:
    # Run once per day at an off-peak minute. GitHub Actions cron uses UTC.
    - cron: "37 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query the public service settings row
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 20 \
            "https://nhzxlsjwsvyimozubbho.supabase.co/rest/v1/service_settings?select=id&id=eq.1&limit=1" \
            -H "apikey: sb_publishable_afp59GoL5-3i0t_0h-0NwQ_Pl3FmZtT" \
            -H "Accept: application/json"

          echo
          echo "Supabase keep-alive query completed successfully."
