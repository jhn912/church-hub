<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin | Ministerio Cristiano Shekinah</title>
</head>
<body>
  <script>
    fetch("/admin.html", { cache: "no-cache" })
      .then((response) => {
        if (!response.ok) throw new Error("Could not load the admin portal.");
        return response.text();
      })
      .then((html) => {
        html = html.replace("<head>", '<head>\n  <base href="/">');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.body.innerHTML = "<p>Unable to load the admin portal. Please try again.</p>";
      });
  </script>
</body>
</html>
